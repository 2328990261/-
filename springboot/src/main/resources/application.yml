spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # AI 荐书（Spring AI，OpenAI 兼容接口；密钥用环境变量或 application-local.yml 覆盖）
  ai:
    model:
      chat: ${AI_CHAT_MODEL_PROVIDER:openai}
      embedding: none
    openai:
      api-key: ${AI_API_KEY:}
      base-url: ${AI_BASE_URL:https://api.ls1223.cn/v1}
      chat:
        # 中转站是 OpenAI 兼容接口（base-url 已含 /v1），chat 路径用 /chat/completions
        completions-path: ${AI_CHAT_COMPLETIONS_PATH:/chat/completions}
        options:
          # 默认 mimo-v2.6-pro（支持图片 URL）；也可用 deepseek-v4-flash / glm-5-3-flash
          model: ${AI_MODEL:mimo-v2.6-pro}
          temperature: ${AI_TEMPERATURE:0.6}
  # 数据库配置（保持你的信息）
  datasource:
    url: jdbc:mysql://localhost:3306/novel_db
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 文件上传大小限制配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 500MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      timeout: ${REDIS_TIMEOUT:1s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}

# 服务器端口
server:
  port: 8081

# 图片上传目录（统一放在项目根目录下的 uploads 文件夹）
# 必须用绝对路径：如果继续用 ${user.dir}/../uploads，从项目根目录启动后端时会读成
# 项目外一层的 uploads，导致封面/轮播图 404。可用环境变量 UPLOAD_COVERS_DIR /
# UPLOAD_BANNERS_DIR 覆盖（例如项目移动到其他盘符后）。
upload:
  covers-dir: ${UPLOAD_COVERS_DIR:D:/毕业设计/轻小说推荐系统/uploads/covers}
  banners-dir: ${UPLOAD_BANNERS_DIR:D:/毕业设计/轻小说推荐系统/uploads/banners}
  epub-images-dir: ${UPLOAD_EPUB_IMAGES_DIR:D:/毕业设计/轻小说推荐系统/uploads/epub-images}
  ai-images-dir: ${UPLOAD_AI_IMAGES_DIR:D:/毕业设计/轻小说推荐系统/uploads/ai-images}

# AI 图片的公网访问根地址（本地调试默认取请求 host；如需让中转站访问，请配置成公网地址或内网穿透地址）
ai:
  # AI 助手 API Key 的 AES-GCM 加密密钥（生产可用环境变量 AI_API_KEY_SECRET 覆盖）
  api-key-secret: ${AI_API_KEY_SECRET:novel-ai-key-secret-change-me}
  image:
    base-url: ${AI_PUBLIC_BASE_URL:}

app:
  cache:
    enabled: ${APP_CACHE_ENABLED:true}
    recommend-ttl: ${CACHE_RECOMMEND_TTL:5m}
    public-ttl: ${CACHE_PUBLIC_TTL:5m}
    config-ttl: ${CACHE_CONFIG_TTL:10m}
    tag-heat-ttl: ${CACHE_TAG_HEAT_TTL:5m}
    version-ttl: ${CACHE_VERSION_TTL:7d}

mybatis:
  # Mapper XML文件路径
  mapper-locations: classpath:mapper/*.xml, classpath:com/wangrui/springboot/mapper/*.xml
  # 实体类别名包
  type-aliases-package: com.wangrui.springboot.pojo
  configuration:
    # 驼峰命名自动转换
    map-underscore-to-camel-case: true
    # 打印SQL日志（排查 SQL 时临时取消注释；日常/答辩建议保持关闭）
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
